# Gerado pelo matugen a partir do wallpaper. Edite o modelo em ~/.config/matugen/templates/fetch.conf
spin=y
shading=*#%&$@
depth=2.5

# cores: frente do logo = cor principal, lateral = secundária; nomes em kitty color200 (= principal)
logo_inner=38;2;{{colors.primary.default.red}};{{colors.primary.default.green}};{{colors.primary.default.blue}}
logo_outer=38;2;{{colors.secondary.default.red}};{{colors.secondary.default.green}};{{colors.secondary.default.blue}}
label_color=38;5;200

# mesma lista do fastfetch
os
host
kernel
uptime
packages
shell
theme
icons
cpu
gpu
memory
disk
