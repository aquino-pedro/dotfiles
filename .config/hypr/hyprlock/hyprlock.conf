$WALLPAPER_PATH	= ~/.config/hypr/hyprlock/wallpaper

# background
background {
	path = $WALLPAPER_PATH
	blur_passes = 1
#	contrast = 0.9
#	brightness = 0.7
#	vibrancy = 0.15
#	vibrancy_darkness = 0.0
}

# general
general {
	disable_loading_bar = false
	hide_cursor = true #essa eu adicionei
}

# input password field
input-field {
	monitor =
	size = 160, 37
	outline_thickness = 2
	dots_size = 0.2
	dots_spacing = 0.2

	outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
	check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
	fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg
	inner_color= rgb(188, 210, 212)

	font_color = rgb(65, 83, 84)
    	fade_on_empty = false
    	rounding = 20

    	position = 0, -180
    	halign = center
    	valign = center
}

# TIME
label {
	monitor =
	text = cmd[update:30000] echo "$(date +"%R")"
	font_size = 80
	position = 0, -40
	halign = center
	valign = top
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    font_size = 16
    position = 0, -185
    halign = center
    valign = top
}
