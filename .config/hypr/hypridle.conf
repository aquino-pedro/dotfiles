general {
	lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="enable"})'
}


# diminuir brilho da tela
listener {
	timeout = 300				# segundos
	on-timeout = brightnessctl -s set 1%	# salva brilho atual e seta para 1%
	on-resume = brightnessctl -r		# restaura brilho salvo
}

# lockscreen
listener {
	timeout = 500				# tempo para lockscreen
	on-timeout = loginctl lock-session	# lockscreen
}

listener {
	timeout = 1800				# segundos
	on-timeout = systemctl suspend		# suspender
}
